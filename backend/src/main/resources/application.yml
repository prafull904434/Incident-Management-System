
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: ims-backend
    version: 1.0.0

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/ims_signals}

  #Supabase PostgreSQL Configuration 
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.uyqqgziiipadmryjwmpb.supabase.co:5432/postgres?sslmode=require&connectTimeout=60}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:@1234Prafull}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update  # change to 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          fetch_size: 50
          batch_size: 10
        order_inserts: true
        order_updates: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: simple
    cache-names:
      - dashboard:summary
      - dashboard:realtime
      - incidents:active

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null
    time-zone: UTC

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: ims-scheduler-
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: ims-async-

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

#Logging Configuration 
logging:
  level:
    root: INFO
    com.ims: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ims.log
    max-size: 10MB
    max-history: 10