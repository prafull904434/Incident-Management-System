
spring:
  # PostgreSQL 
  datasource:
    url: jdbc:postgresql://localhost:5432/ims_db
    username: ims_user
    password: ims_pass

  # MongoDB
  data:
    mongodb:
      uri: mongodb://localhost:27017/ims_signals

  # Redis 
    redis:
      host: localhost
      port: 6379

  # JPA 
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#Logging 
logging:
  level:
    root: INFO
    com.ims: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG