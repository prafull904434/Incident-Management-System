
spring:
  # PostgreSQL
  datasource:
    url: ${DB_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/ims_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:ims_user}}
    password: ${DB_PASSWORD:${POSTGRES_PASS:ims_pass}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  # MongoDB
  data:
    mongodb:
      uri: ${MONGODB_URI:${MONGO_URI:mongodb://127.0.0.1:27017/ims_signals}}

  # Keep production deploy simple: no Redis dependency required.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: simple

  # JPA - Don't show SQL in production
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

#Logging - Less verbose in Production
logging:
  level:
    root: WARN
    com.ims: INFO
  file:
    name: logs/application.log