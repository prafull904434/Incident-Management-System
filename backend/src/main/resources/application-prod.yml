
spring:
  # PostgreSQL 
  datasource:
    url: jdbc:postgresql://${DB_HOST:prod-db.example.com}:5432/ims_prod
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  # MongoDB 
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://prod-user:prod-pass@cluster.mongodb.net/ims_prod}

  # Redis 
    redis:
      host: ${REDIS_HOST:prod-redis.example.com}
      port: 6379
      password: ${REDIS_PASSWORD}

  # JPA - Don't show SQL in production
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  

#Logging - Less verbose in Production 
logging:
  level:
    root: WARN
    com.ims: INFO
  file:
    name: /var/log/ims/application.log